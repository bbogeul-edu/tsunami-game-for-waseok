<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지진해일에서 살아남기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* =========================================================
   1) 색과 글꼴 (디자인 토큰)
   게임은 '바닷가 저녁 하늘' 느낌의 어두운 화면 하나로 고정했어요.
   ========================================================= */
:root{
  color-scheme: dark;
  --ink:#0b1626;          /* 가장 어두운 바탕 */
  --glass:rgba(12,24,42,.84); /* 말풍선 유리판 */
  --line:rgba(214,232,255,.16);
  --paper:#f6f1e4;        /* 밝은 글자 / 선택지 바탕 */
  --paper-ink:#1b2433;    /* 선택지 글자 */
  --muted:#a9b8cc;
  --go:#14a06a;           /* 대피 표지판 초록 */
  --go-ink:#eafff4;
  --heart:#ff5a6e;
  --warn:#ffcf4a;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--ink);color:var(--paper);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none}
button,input,select{font:inherit}
button{cursor:pointer}

/* =========================================================
   2) 무대(배경) — 배경 그림 두 장을 겹쳐서 부드럽게 바꿔요
   ========================================================= */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
.bg{position:absolute;inset:-3%;opacity:0;transition:opacity .9s ease;background-size:cover;background-position:center}
.bg.on{opacity:1}
.bg svg{width:100%;height:100%;display:block}
.pic{position:absolute;left:0;top:50%;transform:translateY(-50%)}
.bobw,.kb{position:absolute;inset:0}
.kb img,.kb canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.kb{animation:kb 28s ease-in-out infinite alternate}
.kb.fast{animation-duration:9s}
.bobw.bob{animation:bob .95s ease-in-out infinite}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.11)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.45%)}}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(5,10,20,.55) 100%),
             linear-gradient(to bottom,rgba(5,10,20,.35),transparent 18%,transparent 52%,rgba(5,10,20,.82))}
#stage.shake .bg{animation:shake .32s infinite}
#stage.tremble .bg{animation:shake .3s 3}
#stage.slow .bg{filter:blur(2px) saturate(.6) brightness(.85);transition:filter 1s}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-10px,4px)}50%{transform:translate(8px,-5px)}75%{transform:translate(-6px,-3px)}}
#wave{position:absolute;left:-10%;right:-10%;bottom:-110%;height:110%;pointer-events:none;
  background:linear-gradient(to top,#0d3b5c 0%,#1e6f96 55%,rgba(220,245,255,.85) 92%,rgba(255,255,255,0) 100%)}
#wave.go{animation:wave 2.6s ease-in-out}
@keyframes wave{0%{bottom:-110%}45%{bottom:-25%}60%{bottom:-25%}100%{bottom:-110%}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash 2s ease}
@keyframes flash{0%{opacity:0}25%{opacity:1}55%{opacity:1}100%{opacity:0}}

/* =========================================================
   3) 위쪽 막대: 장 이름, 하트, 읽어주기
   ========================================================= */
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;z-index:5;pointer-events:none}
#hud > *{pointer-events:auto}
#chLabelOld{font-family:var(--display);font-size:1.05rem;letter-spacing:.02em;background:var(--glass);border:1px solid var(--line);
  padding:8px 14px;border-radius:999px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-right{display:flex;gap:10px;align-items:center}
#prog{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px 14px 10px;width:min(300px,38vw);min-width:0}
#prog .pl{display:flex;gap:8px;align-items:baseline;font-family:var(--display);white-space:nowrap;overflow:hidden}
#prog .pl b{font-weight:400;color:var(--warn);font-size:1.05rem}
#prog .pl span{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;min-width:0}
#prog .pl em{font-style:normal;color:var(--muted);font-size:.8rem;margin-left:auto}
.pbar{position:relative;height:9px;border-radius:999px;background:rgba(255,255,255,.14);margin-top:6px;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,var(--go),#5fd3a0);transition:width .6s ease}
.pbar .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(12.5% - 1px),rgba(11,22,38,.85) calc(12.5% - 1px) 12.5%)}
.nav{display:flex;gap:6px}
.round:disabled{opacity:.35;cursor:default}
#skipBtn.on{background:var(--go);color:var(--go-ink)}
.menu-panel{display:flex;flex-direction:column;gap:12px;text-align:center}
.ghost-btn{background:transparent;border:1px solid var(--line);color:var(--paper);border-radius:14px;padding:13px;font-family:var(--display);font-size:1.1rem}
.ver{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);font-family:var(--display);font-size:.8rem;color:var(--muted);z-index:11}
#hearts{display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);padding:7px 12px;border-radius:999px}
#hearts svg{width:26px;height:26px;transition:transform .3s}
#hearts svg.lost path{fill:#3a4558}
#hearts svg.pop{animation:pop .7s}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(-10deg)}100%{transform:scale(1)}}
.round{background:var(--glass);border:1px solid var(--line);color:var(--paper);border-radius:999px;padding:8px 14px;font-family:var(--display);font-size:.95rem;display:flex;gap:6px;align-items:center}
.round[aria-pressed="false"]{color:var(--muted)}
.round[aria-pressed="false"] .w{display:none}

/* =========================================================
   4) 아래쪽: 선택지 + 말풍선
   ========================================================= */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  display:flex;flex-direction:column;align-items:center;gap:12px}
#bottom > *{width:100%;max-width:880px}
#choices{display:flex;flex-direction:column;gap:10px}
#choices[hidden]{display:none!important}
.q{font-family:var(--display);font-size:1.25rem;text-align:center;text-wrap:balance;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.opt{background:var(--paper);color:var(--paper-ink);border:0;border-radius:16px;padding:16px 18px;text-align:left;
  font-size:1.15rem;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.35);display:flex;gap:12px;align-items:flex-start;
  transition:transform .12s, background .2s;animation:rise .35s both}
.opt:active{transform:scale(.98)}
.opt .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--paper-ink);color:var(--paper);
  font-family:var(--display);display:grid;place-items:center;font-size:1rem}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hint{align-self:center;background:transparent;border:2px dashed rgba(234,255,244,.55);color:var(--go-ink);border-radius:999px;
  padding:9px 18px;font-family:var(--display);font-size:1rem}
.timer{height:12px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--heart),var(--warn));transform-origin:left}

#dialog{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:16px 18px 14px;
  display:flex;gap:14px;align-items:flex-start;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-height:96px;cursor:pointer}
#dialog[hidden]{display:none!important}
.ava{flex:none;width:76px;height:76px;overflow:hidden;border-radius:50%;display:grid;place-items:center;font-family:var(--display);
  font-size:1.5rem;color:#fff;border:3px solid rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(0,0,0,.4)}
.ava.none{display:none}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava.pop{animation:avapop .35s ease-out}
@keyframes avapop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.say{min-width:0;flex:1}
.who{font-family:var(--display);font-size:1.05rem;margin-bottom:2px}
.dir{font-size:.9rem;color:var(--muted);margin-bottom:2px}
.txt{font-size:1.28rem;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.narr .txt{font-style:normal;color:#e6edf7}
.next{font-family:var(--display);font-size:.85rem;color:var(--muted);text-align:right;margin-top:4px;opacity:0;transition:opacity .2s}
.next.on{opacity:1;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}

/* =========================================================
   5) 덮개 화면 (시작, 장 제목, 피드백, 카드뉴스, 게임 엔드, 엔딩)
   ========================================================= */
.cover{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:rgba(6,12,24,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow-y:auto}
.cover[hidden]{display:none!important}
.panel{width:100%;max-width:560px;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:26px 24px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);animation:rise .4s both}
.big-btn{width:100%;border:0;border-radius:16px;padding:16px;font-family:var(--display);font-size:1.3rem;background:var(--go);color:var(--go-ink);
  box-shadow:0 6px 0 #0b6b46;margin-top:6px}
.big-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0b6b46}
.big-btn.red{background:#e2465b;box-shadow:0 6px 0 #9c2638;color:#fff}

/* 시작 화면 */
#start .panel{max-width:520px}
.kicker{font-family:var(--display);color:var(--warn);letter-spacing:.08em;font-size:.95rem;text-align:center}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,7vw,3rem);line-height:1.15;text-align:center;margin:.2em 0 .5em;text-wrap:balance}
h1 span{color:#7fd3ff}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-family:var(--display);font-size:1rem;color:var(--muted)}
.field input,.field select{background:rgba(255,255,255,.95);color:var(--paper-ink);border:0;border-radius:12px;padding:13px 14px;font-size:1.2rem;min-width:0}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row .field{min-width:0}
.school{background:rgba(255,255,255,.12)!important;color:var(--paper)!important}
.err{color:#ffb3bd;font-size:.95rem;min-height:1.3em;margin:-6px 0 8px}
.tts-row{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;font-family:var(--display)}
.switch{width:58px;height:32px;border-radius:999px;border:0;background:#45516a;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-pressed="true"]{background:var(--go)}
.switch[aria-pressed="true"]::after{left:30px}

/* 장 제목 */
#chapter{background:rgba(6,12,24,.78)}
#chapter .inner{text-align:center;animation:rise .5s both}
#chapter .n{font-family:var(--display);color:var(--warn);font-size:1.3rem;letter-spacing:.1em}
#chapter .t{font-family:var(--display);font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.2;text-wrap:balance}
#chapter .s{color:var(--muted);margin-top:10px;font-family:var(--display)}

/* 피드백 / 게임 엔드 */
.fb-title{font-family:var(--display);font-size:1.9rem;color:#ffb3bd;text-align:center;margin:0 0 6px}
.fb-heart{display:flex;justify-content:center;margin-bottom:8px}
.fb-heart svg{width:58px;height:58px;animation:pop .8s}
.lesson{background:rgba(255,255,255,.08);border-left:5px solid var(--warn);border-radius:10px;padding:14px 16px;font-size:1.22rem;line-height:1.6;margin:10px 0 18px;word-break:keep-all}
.lesson b{font-family:var(--display);font-weight:400;color:var(--warn);display:block;font-size:1rem;margin-bottom:2px}

/* 행정안전부 카드뉴스 */
.card{max-width:560px;width:100%;background:#fffdf7;color:#1d2533;border-radius:22px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:rise .4s both}
.card-top{background:#0f7a55;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display)}
.card-top .chip{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:.85rem;white-space:nowrap}
.card-top .kind{font-size:.95rem;min-width:0}
.card-body{padding:20px 22px 8px}
.card-body h3{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.25;margin:0 0 12px;color:#0b5c41;text-wrap:balance}
.card-body img{width:100%;border-radius:12px;margin-bottom:12px;display:block}
.card-body ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.card-body li{font-size:1.18rem;line-height:1.55;padding-left:30px;position:relative;word-break:keep-all}
.card-body li::before{content:"";position:absolute;left:4px;top:.45em;width:14px;height:14px;border-radius:4px;background:#14a06a}
.card-body li.emph{background:#fff1b8;border-radius:8px;padding:6px 10px 6px 34px;font-weight:700}
.card-body li.emph::before{left:10px;top:.75em}
.card-foot{padding:10px 22px 20px;display:flex;flex-direction:column;gap:8px}
.card-foot small{color:#5e6b7d;font-size:.85rem}
.card .big-btn{margin-top:0}

/* 엔딩 */
#ending .panel{max-width:600px;text-align:center}
.medal{width:96px;height:96px;margin:0 auto 6px;display:block}
.title-badge{font-family:var(--display);font-size:clamp(1.8rem,6vw,2.4rem);color:var(--warn);margin:0}
.who-line{color:var(--muted);margin:4px 0 18px}
.rule{background:#fffdf7;color:#1d2533;border-radius:18px;padding:22px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.rule .no{font-family:var(--display);color:#0f7a55;font-size:1rem}
.rule p{margin:0;font-size:1.35rem;line-height:1.55;word-break:keep-all;font-family:var(--display);font-weight:400}
.rule small{color:#5e6b7d}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}
.pager button{background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--paper);border-radius:12px;padding:10px 16px;font-family:var(--display);font-size:1rem}
.pager button:disabled{opacity:.3}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-width:0}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.on{background:var(--warn)}

@media (max-width:520px){
  .txt{font-size:1.12rem}
  .opt{font-size:1.04rem;padding:13px 14px}
  .ava{width:58px;height:58px;font-size:1.2rem}
  #hud{flex-wrap:wrap}
  #prog{order:2;flex-basis:100%;width:auto;padding:6px 12px 8px}
  #prog .pl em{display:none}
  .nav .round{padding:8px 10px}
  .round .lbl{display:none}
}
@media (prefers-reduced-motion: reduce){
  .kb,.bobw.bob{animation:none}
  #stage.shake .bg,#stage.tremble .bg{animation:none}
  #wave.go{animation-duration:.01s}
  .opt,.panel,.card{animation:none}
}
</style>
</head>
<body>

<!-- ================= 화면 뼈대 (HTML) ================= -->
<div id="stage">
  <div class="bg" id="bgA"></div>
  <div class="bg" id="bgB"></div>
  <div id="vignette"></div>
  <div id="wave"></div>
  <div id="flash"></div>
</div>

<div id="hud" hidden>
  <div id="prog" aria-label="진행도">
    <div class="pl"><b id="chNum">1장</b><span id="chName">바닷가에 도착했어요</span><em>/ 8장</em></div>
    <div class="pbar"><i id="pfill"></i><span class="ticks"></span></div>
  </div>
  <div class="hud-right">
    <div class="nav">
      <button class="round" id="backBtn" title="앞 대사 다시 보기" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">뒤로</span></button>
      <button class="round" id="skipBtn" title="다음 선택지까지 건너뛰기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5l8 7-8 7zM12 5l8 7-8 7z"/></svg><span class="lbl">건너뛰기</span></button>
      <button class="round" id="restartBtn" title="다시 시작">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg><span class="lbl">다시</span></button>
    </div>
    <div id="hearts" aria-label="남은 하트"></div>
    <button class="round" id="sndBtn" aria-pressed="true" title="효과음 켜기/끄기">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
      <span class="lbl" id="sndLbl">소리 켬</span>
    </button>
  </div>
</div>

<div id="bottom">
  <div id="choices" hidden></div>
  <div id="dialog" hidden>
    <div class="ava" id="ava"></div>
    <div class="say">
      <div class="who" id="who"></div>
      <div class="dir" id="dir"></div>
      <div class="txt" id="txt"></div>
      <div class="next" id="next">눌러서 계속 ▶</div>
    </div>
  </div>
</div>

<!-- 시작 화면 (0장) -->
<div class="cover" id="start">
  <div class="ver">v1.1.0</div>
  <form class="panel" id="startForm" autocomplete="off">
    <div class="kicker">와석초등학교 현장체험학습</div>
    <h1>지진해일에서 <span>살아남기</span></h1>
    <div class="field">
      <label for="nm">내 이름을 써 주세요</label>
      <input id="nm" maxlength="8" placeholder="예) 김하늘">
    </div>
    <div class="err" id="err"></div>
    <div class="row">
      <div class="field"><label>학교</label><input class="school" value="와석초" disabled></div>
      <div class="field"><label for="gr">학년</label><select id="gr"></select></div>
      <div class="field"><label for="cl">반</label><select id="cl"></select></div>
    </div>
    <button class="big-btn" type="submit">시작하기</button>
  </form>
</div>

<div class="cover" id="chapter" hidden><div class="inner"><div class="n" id="chN"></div><div class="t" id="chT"></div><div class="s">자동 저장했어요</div></div></div>

<div class="cover" id="menu" hidden>
  <div class="panel menu-panel">
    <p class="fb-title" style="color:var(--paper)">어디서부터 다시 할까요?</p>
    <button class="big-btn" id="rsChapter">이 장 처음부터</button>
    <button class="big-btn red" id="rsGame">1장부터 다시 (하트 3개)</button>
    <button class="ghost-btn" id="rsCancel">계속하기</button>
  </div>
</div>

<div class="cover" id="feedback" hidden>
  <div class="panel">
    <div class="fb-heart" id="fbHeart"></div>
    <p class="fb-title">앗, 위험했어요!</p>
    <div class="lesson"><b>왜 위험했을까요?</b><span id="fbText"></span></div>
    <button class="big-btn" id="fbBtn">알겠어요, 계속할게요</button>
  </div>
</div>

<div class="cover" id="over" hidden>
  <div class="panel">

<script>
/* =================================================================

             → ④ 대본(이야기) → ⑤ 엔진(대본을 한 줄씩 실행) → ⑥ 시작

const state = {

/* 나중에 진짜 배경 그림을 넣을 자리:
   예) BG_IMAGES.beach = 'img/beach.jpg';  → 그 장면은 그림 파일로 바뀌어요 */

['beach','rock','shop','lowtide','crowd','crossroads','powerline','stairs','deck','deckcrack','deckcalm','rescue','dusk'].forEach(k=>BG_IMAGES[k] = `img/${k}.jpg`);
// 미리 불러 두면 장면이 바뀔 때 깜빡이지 않아요
Object.values(BG_IMAGES).forEach(src=>{ const i = new Image(); i.src = src; });

/* ② 행정안전부 카드뉴스·포스터 (img 칸에 내려받은 그림 파일 이름을 넣으면 같이 떠요) */
const MOIS_TSUNAMI = '행정안전부 · 지진해일 대피요령 카드뉴스';
const MOIS_QUAKE = '행정안전부 · 지진 국민행동요령';
const CARDS = {
  t1:{kind:MOIS_TSUNAMI, no:'1/6', title:'지진해일 발생 시에는 높은 곳으로!', img:'',
      lines:['바닷가에서 지진을 느끼면 지진해일이 올 수 있어요.','오늘은 친구들과 함께 높은 곳으로 대피하는 법을 배워 봐요.']},
  t2:{kind:MOIS_TSUNAMI, no:'2/6', title:'지진해일 발생 시 대피요령', img:'',
      lines:['바닷가에서 지진을 느끼면 바로 바다와 하천에서 벗어나요.','높은 곳으로 빠르게 대피해요.','시간이 없으면 튼튼한 3층 이상 건물이나 긴급대피장소로 가요.']},
  t3:{kind:MOIS_TSUNAMI, no:'3/6', title:'지진해일 전조증상', img:'',
      lines:['바닷물이 갑자기 쭉 빠져나가요.','기차가 지나가는 것 같은 큰 소리가 나요.','이런 신호가 보이면 바로 높은 곳으로 대피해요.']},
  t4:{kind:MOIS_TSUNAMI, no:'4/6', title:'특보 해제 전까지 높은 곳에서 대기', img:'',
      lines:['지진해일은 한 번으로 끝나지 않아요.','여러 번, 몇 분 간격으로 다시 몰려와요.','특보가 해제될 때까지 높은 곳에서 기다려요.']},
  t5:{kind:MOIS_TSUNAMI, no:'5/6', title:'지진해일 긴급대피장소', img:'',
      lines:['초록색 표지판이 긴급대피장소로 가는 길을 알려 줘요.','놀러 가는 바닷가의 긴급대피장소를 미리 알아 두어요.']},
  t6:{kind:MOIS_TSUNAMI, no:'6/6', title:'더 알아보기', img:'',
      lines:['행정안전부 지진안전 누리집에서 지진과 지진해일 행동요령을 더 볼 수 있어요.','가족과 함께 우리 동네 대피장소를 찾아봐요.']},
  e1:{kind:MOIS_QUAKE, no:'포스터', title:'지진 상황별 국민행동요령', img:'',
      lines:['흔들릴 때는 몸을 낮추고 머리를 보호해요.','건물 밖에서는 가방이나 팔로 머리를 감싸고 건물과 거리를 두어요.','흔들림이 멈추면 넓은 곳으로 대피해요.','차를 타지 말고, 재난방송 안내를 따라요.']},
  e2:{kind:MOIS_QUAKE, no:'포스터', title:'지진 장소별 국민행동요령', img:'',
      lines:['산에서는 산사태가 날 수 있으니 조심해요.','바닷가에서는 절벽 아래를 피하고, 지진해일 특보가 나면 높은 곳으로 가요.']}
};
// 8장에서는 같은 4번 카드를 '특보 해제' 줄을 강조해서 다시 보여줘요
CARDS.t4b = {...CARDS.t4, emph:2};

const RULES = [
  '흔들릴 땐 몸을 낮추고 머리를 보호해요.',
  '절벽, 간판, 유리창에서 떨어져요.',
  '바닷가에서 큰 지진이 나면 경보를 기다리지 말고 바로 대피해요.',
  '바닷물이 갑자기 빠지면 해일이 온다는 신호예요.',
  '차가 아니라 걸어서, 초록색 표지판을 따라 높은 곳으로 가요.',
  '끊어진 전깃줄에는 가까이 가지 않아요.',
  '물건을 가지러 돌아가지 않아요.',
  '좁은 곳에서는 밀지 말고 한 줄로 가요.',
  '해일은 여러 번 와요. 물이 빠져도 내려가지 않아요.',
  '누가 말했는지보다 무슨 말인지를 보고 판단해요.',
  '사고를 보면 어른에게 바로, 정확하게 알려요.',
  '안전하다는 안내가 있을 때까지 기다려요.'
];

/* 등장인물: 이름, 프로필 색 */
const PEOPLE = {
  me:{name:()=>state.call, color:'#e9a514'},
  sh:{name:'성훈', color:'#ef7a2b'},
  jho:{name:'재호', color:'#8a5cd6'},
  jhy:{name:'재현', color:'#2f7fe0'},
  sw:{name:'송화', color:'#1fa37a'},
  teacher:{name:'선생님', color:'#0f8a94', mark:'선'},
  driver:{name:'기사님', color:'#6b7787', mark:'기'},
  rescuer:{name:'구조대원', color:'#d9364c', mark:'구'},
  radio:{name:'안내 방송', color:'#46536b', mark:'📢'}
};

/* 인물 프로필 얼굴: 기본 표정 + 상황별 표정 (대본에서 S('sw:cry', …)처럼 고르면 돼요) */
const FACES = {
  sh: ['scared','worried','cry','shock'], sw: ['scared','worried','cry','shock'],
  jhy:['scared','serious','cry','shock'], jho:['scared','upset','cry','shock'],
  teacher:[]
};
const faceSrc = (id, mood)=> FACES[id] ? `img/face/${id}${mood && FACES[id].includes(mood) ? '_'+mood : ''}.jpg` : null;
Object.entries(FACES).forEach(([id, ms])=>[null, ...ms].forEach(m=>{ const i = new Image(); i.src = faceSrc(id, m); }));

/* ③ 배경 그림 (임시 그림) — 실사 느낌 그림이 준비되면 BG_IMAGES로 바꿔 끼워요 */
let uid = 0;
function grad(id, stops, vertical=true){
  return `<linearGradient id="${id}" x1="0" y1="0" x2="${vertical?0:1}" y2="${vertical?1:0}">${stops.map(([o,c])=>`<stop offset="${o}" stop-color="${c}"/>`).join('')}</linearGradient>`;
}
function wavePath(y, amp, len, h, close=true){ // 물결 모양 선
  let d = `M-50 ${y}`;
  for(let x=-50; x<1650; x+=len){ d += ` q${len/4} ${-amp} ${len/2} 0 t${len/2} 0`; }
  return close ? d + ` L1650 ${y+h} L-50 ${y+h}Z` : d;
}
function clouds(op=.85, col='#fff'){
  return `<g fill="${col}" opacity="${op}"><ellipse cx="280" cy="170" rx="150" ry="32"/><ellipse cx="360" cy="148" rx="90" ry="40"/><ellipse cx="980" cy="110" rx="190" ry="30"/><ellipse cx="1060" cy="92" rx="100" ry="36"/><ellipse cx="1420" cy="230" rx="120" ry="24"/></g>`;
}
function svgWrap(defs, body){
  return `<svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${body}</svg>`;
}
function seaShore(p, o){ // 하늘 + 바다 + 모래 공통 바탕
  return {
    defs: grad(p+'k',[[0,o.sky1],[.75,o.sky2],[1,o.sky3]]) + grad(p+'s',[[0,o.sea1],[1,o.sea2]]) + grad(p+'d',[[0,o.sand1],[1,o.sand2]]) +
          `<radialGradient id="${p}u"><stop offset="0" stop-color="${o.sun||'#fffbe6'}" stop-opacity="1"/><stop offset="1" stop-color="${o.sun||'#fffbe6'}" stop-opacity="0"/></radialGradient>`,
    body: `<rect width="1600" height="1000" fill="url(#${p}k)"/><circle cx="${o.sunX||1300}" cy="${o.sunY||150}" r="${o.sunR||170}" fill="url(#${p}u)"/>` + clouds(o.cloudOp??.85, o.cloud||'#fff') +
          `<path d="M-10 ${o.hz} L-10 330 Q110 300 230 350 Q330 400 440 ${o.hz}Z" fill="${o.land||'#5d7f6a'}"/>` +
          `<rect y="${o.hz-5}" width="1600" height="${o.shore-o.hz+40}" fill="url(#${p}s)"/>` +
          `<g fill="#fff" opacity=".35"><rect x="300" y="${o.hz+40}" width="120" height="3"/><rect x="760" y="${o.hz+70}" width="200" height="3"/><rect x="1180" y="${o.hz+30}" width="90" height="3"/><rect x="540" y="${o.hz+110}" width="160" height="4"/></g>` +
          (o.foam===false?'':`<path d="${wavePath(o.shore-12,10,200,40)}" fill="#fff" opacity=".7"/>`) +
          `<path d="${wavePath(o.shore,8,400,1000-o.shore+20)}" fill="url(#${p}d)"/>`
  };
}
const DAY = {sky1:'#4c9ee3',sky2:'#bfe3f6',sky3:'#eaf6fb',sea1:'#1f6ea6',sea2:'#4ab4d0',sand1:'#f3e1b6',sand2:'#d8b67b',hz:470,shore:650};
function flag(x,y){return `<line x1="${x}" y1="${y}" x2="${x}" y2="${y+330}" stroke="#4b5563" stroke-width="7"/><path d="M${x} ${y} q70 -14 130 8 q-60 24 -130 52z" fill="#2d6cdf"/>`;}
function people(x,y,n,col='#26324a',s=1){ // 멀리 있는 사람들 실루엣
  let g='';for(let i=0;i<n;i++){const px=x+i*38*s+(i%3)*6, py=y+(i%2)*10;g+=`<circle cx="${px}" cy="${py}" r="${11*s}" fill="${col}"/><rect x="${px-11*s}" y="${py+12*s}" width="${22*s}" height="${46*s}" rx="${10*s}" fill="${col}"/>`;}return g;}

/* ---------- 2D 동네 거리 장면 (원근법으로 그려요) ----------
   세상 좌표: X(좌우, m) / Y(높이, m) / D(앞으로의 거리, m) → 화면 좌표로 바꿔서 그려요 */
function townScene(p, o){
  const VX = o.vx ?? 820, HZ = o.hz ?? 470, F = 900, CAM = 1.6;
  const P = (X, Y, D) => [VX + X*F/D, HZ + (CAM - Y)*F/D];
  const pt = a => a.map(v=>v.toFixed(1)).join(' ');
  const poly = (pts, fill, sw=3) => `<path d="M${pts.map(pt).join(' L')}Z" fill="${fill}" stroke="#262b33" stroke-width="${sw}" stroke-linejoin="round"/>`;
  let seed = o.seed || 7; const rnd = ()=>{ seed = (seed*16807) % 2147483647; return seed/2147483647; };
  const INK = '#262b33';
  const items = []; // [깊이, svg]

  /* 하늘: 납작한 구름 띠 */
  let sky = `<rect width="1600" height="1000" fill="${o.sky1||'#9aa5ae'}"/>
    <rect y="0" width="1600" height="160" fill="${o.sky0||'#7d8893'}"/>
    <path d="M0 160 Q200 120 420 150 T860 140 T1300 155 T1600 135 V0 H0Z" fill="${o.sky0||'#7d8893'}"/>
    <path d="M0 250 Q260 220 520 245 T1040 235 T1600 250 V300 H0Z" fill="${o.sky2||'#aab3ba'}" opacity=".8"/>`;

  /* 길 끝 풍경: 언덕 또는 거대한 파도 */
  let far = '';
  if (o.hill){
    far += `<path d="M${VX-520} ${HZ+6} Q${VX-200} ${HZ-230} ${VX+60} ${HZ-210} Q${VX+330} ${HZ-190} ${VX+620} ${HZ+6}Z" fill="#6f9a63" stroke="${INK}" stroke-width="3"/>
      <path d="M${VX-140} ${HZ-120} Q${VX+20} ${HZ-180} ${VX+200} ${HZ-150}" fill="none" stroke="#557d4c" stroke-width="10"/>
      <path d="M${VX+40} ${HZ} L${VX+70} ${HZ-60} L${VX+20} ${HZ-110} L${VX+80} ${HZ-170} L${VX+60} ${HZ-200}" fill="none" stroke="#d9cfb4" stroke-width="7" stroke-linecap="round"/>
      <g stroke="${INK}" stroke-width="2.5"><rect x="${VX+36}" y="${HZ-232}" width="56" height="26" fill="#d8d2c4"/><path d="M${VX+30} ${HZ-232} h68 l-8 -12 h-52z" fill="#a4553f"/></g>`;
  }
  if (o.wave){
    // 거대한 해일: 울퉁불퉁한 물 벽 + 하얀 물거품 + 물보라
    const L = VX-600, R = VX+560, T = HZ-330, N = 26;
    const top = Array.from({length:N+1},(_,i)=>{ const a=i/N; const x=L+a*(R-L); const y=T + Math.pow(Math.abs(a-.45)*2,2.2)*330 + (i%2? -28-rnd()*30 : rnd()*20); return [x,Math.min(y,HZ-10)]; });
    far += `<path d="M${L} ${HZ+8} L${top.map(pt).join(' L')} L${R} ${HZ+8}Z" fill="#4f6f80" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
    far += `<path d="M${L+120} ${HZ+8} L${top.slice(3,N-2).map(([x,y])=>pt([x,y+70])).join(' L')} L${R-100} ${HZ+8}Z" fill="#3d5966"/>`;
    far += `<path d="M${L+200} ${HZ+8} L${top.slice(6,N-5).map(([x,y])=>pt([x,y+170])).join(' L')} L${R-200} ${HZ+8}Z" fill="#2f4853"/>`;
    far += `<g fill="#eef5f6" stroke="${INK}" stroke-width="3">${top.slice(1,-1).map(([x,y])=>`<circle cx="${x.toFixed(0)}" cy="${(y+14).toFixed(0)}" r="${(24+rnd()*26).toFixed(0)}"/>`).join('')}</g>`;
    far += `<g fill="#eef5f6">${top.slice(1,-1).map(([x,y])=>`<circle cx="${x.toFixed(0)}" cy="${(y+26).toFixed(0)}" r="28"/>`).join('')}</g>`;
    far += `<g fill="#9fb8c3">${top.slice(2,-2).map(([x,y])=>`<path d="M${x-30} ${y+48} q30 18 60 0 q-30 40 -60 0z"/>`).join('')}</g>`;
    far += `<g fill="#ffffff" opacity=".5">${top.slice(1,-1).map(([x,y])=>`<circle cx="${(x+rnd()*40-20).toFixed(0)}" cy="${(y-30-rnd()*60).toFixed(0)}" r="${(18+rnd()*30).toFixed(0)}"/>`).join('')}</g>`;
    far += `<g fill="#ffffff" opacity=".8">${Array.from({length:26},()=>`<circle cx="${(L+rnd()*(R-L)).toFixed(0)}" cy="${(T-60+rnd()*150).toFixed(0)}" r="${(3+rnd()*8).toFixed(0)}"/>`).join('')}</g>`;
  }

  /* 길, 인도 */
  const Dn = 2.2, Df = 90;
  let ground = poly([P(-60,0,Dn),P(60,0,Dn),P(60,0,Df),P(-60,0,Df)], '#7b7f84', 0) +
    poly([P(-6,0,Dn),P(6,0,Dn),P(6,0,Df),P(-6,0,Df)], '#5d6268', 0) +
    poly([P(-6.4,0,Dn),P(-6,0,Dn),P(-6,0,Df),P(-6.4,0,Df)], '#c9c6bd', 0) +
    poly([P(6,0,Dn),P(6.4,0,Dn),P(6.4,0,Df),P(6,0,Df)], '#c9c6bd', 0);
  for (let d=3; d<70; d+=6) ground += poly([P(-.12,0,d),P(.12,0,d),P(.12,0,d+2.6),P(-.12,0,d+2.6)], '#e7dfbf', 0);
  if (o.wet) ground += `<g fill="#8fa3ae" opacity=".55">${[[ -2,6],[3,10],[-4,16],[1.5,24]].map(([x,d])=>`<ellipse cx="${P(x,0,d)[0].toFixed(0)}" cy="${P(x,0,d)[1].toFixed(0)}" rx="${(1.6*F/d).toFixed(0)}" ry="${(.25*F/d).toFixed(0)}"/>`).join('')}</g>`;

  /* 건물: 길 양옆에 줄지어 서 있어요 (간판은 글자 없이) */
  const walls = ['#c46a4f','#d9c9a6','#9fb2b8','#c8a27a','#e1d6c2','#a77a68','#b9c3a4'];
  const signs = ['#d24b3f','#2f6fb5','#e6b33a','#2f8a63','#7a4fa0','#e07a2f'];
  const side = (sgn) => {
    let d = 2.4, k = sgn>0 ? 3 : 0;
    while (d < 75){
      const len = 6 + rnd()*7, h = 6 + rnd()*10, X = sgn*8.2, col = walls[(k++)%walls.length];
      const d2 = Math.min(d+len, 80);
      if (o.alley && sgn>0 && d < 17 && d2 > 13){ items.push([55, poly([P(6.4,0,d),P(30,0,d),P(30,0,d2),P(6.4,0,d2)], '#a39a86', 2) + poly([P(8.2,0,d2),P(30,0,d2),P(30,14,d2),P(8.2,5,d2)], '#6f9a63') + `<path d="M${pt(P(9,0,d2-.5))} Q${pt(P(16,3,d2))} ${pt(P(26,10,d2))}" fill="none" stroke="#d9cfb4" stroke-width="14" stroke-linecap="round"/>`]); d = d2; continue; }
      let g = poly([P(X,0,d),P(X,0,d2),P(X,h,d2),P(X,h,d)], col);
      // 지붕 가장자리
      g += poly([P(X,h,d),P(X,h,d2),P(X,h+.5,d2),P(X,h+.5,d)], '#4b4f57', 2);
      // 창문
      for (let y=3.2; y<h-1; y+=2.8) for (let dd=d+1; dd<d2-1.2; dd+=2.4){

  // 앞쪽에 크게 지나가는 전깃줄 (사진처럼 엉킨 느낌)

  const shade = (hex, k) => { const n = parseInt(hex.slice(1),16); const f = v=>Math.max(0,Math.round(v*k)); return '#'+[f(n>>16),f((n>>8)&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join(''); };
  const TOPS = ['#3e5a78','#7a3b3b','#2f5e55','#6b5a3e','#4b4a6b','#8a6a3a','#5a6470','#9a4f3a','#2c3e57','#c2b49a'];

/* =================================================================
   효과음: 소리 파일 없이 코드로 직접 만들어요 (Web Audio)
   - Sound.play('crash')  → 짧은 효과음 한 번
   - Sound.amb('beach')   → 계속 깔리는 배경 소리 (파도, 바람, 사람들 웅성임…)
   나중에 진짜 녹음 파일을 쓰고 싶으면: SFX_FILES.crash = 'sfx/crash.mp3';
   ================================================================= */
const SFX_FILES = {};
const Sound = (()=>{
  let ctx=null, out=null, master=null, muffleF=null, white=null, brown=null;
  let enabled = true, ambKind = 'none', ambNow = [], quakeNow = null;
  try{ enabled = localStorage.getItem('tsunami-sound') !== '0'; }catch(e){}

  function init(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ctx){
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = enabled ? 1 : 0; master.connect(ctx.destination);
      const comp = ctx.createDynamicsCompressor(); comp.connect(master);
      muffleF = filt('lowpass', 18000); muffleF.connect(comp);
      out = muffleF;
      // 잡음 재료 두 가지: 하얀 잡음(쉬익), 갈색 잡음(우르릉)
      const len = ctx.sampleRate * 3;
      white = ctx.createBuffer(1, len, ctx.sampleRate); brown = ctx.createBuffer(1, len, ctx.sampleRate);
      const w = white.getChannelData(0), b = brown.getChannelData(0); let last = 0;
      for (let i=0;i<len;i++){ const r = Math.random()*2-1; w[i] = r; last = (last + 0.02*r)/1.02; b[i] = last*3.5; }
    }
    if (ctx.state === 'suspended') ctx.resume();
  }
  const now = ()=>ctx.currentTime;
  function filt(type, f, q=0.7){ const x = ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; }
  function gain(v=0){ const g = ctx.createGain(); g.gain.value = v; return g; }
  function chain(...n){ for (let i=0;i<n.length-1;i++) n[i].connect(n[i+1]); return n[n.length-1]; }
  function src(kind){ const s = ctx.createBufferSource(); s.buffer = kind==='brown' ? brown : white; s.loop = true; return s; }
  // 소리 모양: a(커지는 시간) → hold(유지) → r(작아지는 시간)
  function shape(g, t, a, hold, r, peak){
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t+a);
    g.gain.setValueAtTime(peak, t+a+hold); g.gain.exponentialRampToValueAtTime(0.0001, t+a+hold+r);
    return t+a+hold+r;
  }
  function tone(f, {t=now(), type='sine', a=.01, hold=0, r=.3, peak=.3, fEnd=null, vib=0}={}){
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    const g = gain(), end = shape(g, t, a, hold, r, peak);
    if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, end);
    if (vib){ const l = ctx.createOscillator(), lg = gain(vib); l.frequency.value = 28; chain(l, lg, o.frequency); l.start(t); l.stop(end+.05); }
    chain(o, g, out); o.start(t); o.stop(end+.05);
  }
  function burst({t=now(), kind='white', type='lowpass', f=1000, fEnd=null, q=.7, a=.01, hold=0, r=.3, peak=.3}={}){
    const s = src(kind), fl = filt(type, f, q), g = gain(), end = shape(g, t, a, hold, r, peak);
    if (fEnd) fl.frequency.exponentialRampToValueAtTime(fEnd, end);
    chain(s, fl, g, out); s.start(t, Math.random()*2); s.stop(end+.05);
  }
  // 계속 깔리는 소리 한 겹 (rate: 출렁임 빠르기, depth: 출렁임 크기, am: 헬리콥터처럼 두두두)
  function layer({kind='white', type='lowpass', f=800, q=.7, peak=.2, rate=0, depth=0, onFreq=false, am=0}={}){
    const s = src(kind), fl = filt(type, f, q), g = gain(0), t = now(), extra = [];
    let last = chain(s, fl, g);
    if (am){ const ag = gain(.5), l = ctx.createOscillator(), lg = gain(.5); l.type = 'square'; l.frequency.value = am; chain(l, lg, ag.gain); l.start(); extra.push(l); last = chain(g, ag); }
    last.connect(out);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t+1.5);

      s.stop(t2+fd+.1); extra.forEach(o=>o.stop(t2+fd+.1)); } };

      for (let i=0;i<4;i++){ o.frequency.linearRampToValueAtTime(940, t+i*2+1); o.frequency.linearRampToValueAtTime(620, t+i*2+2); }
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t+1.2); g.gain.setValueAtTime(.05, t+6.5); g.gain.linearRampToValueAtTime(0, t+8);
      chain(o, bp, g, out); o.start(t); o.stop(t+8.1); },
    spark(){ const t = now(); for (let i=0;i<14;i++) burst({t:t+Math.random()*.7, type:'highpass', f:3500, a:.002, r:.04, peak:.28});
      tone(110, {t, type:'square', a:.005, hold:.12, r:.05, peak:.06}); tone(60, {t:t+.3, type:'sawtooth', a:.005, hold:.1, r:.05, peak:.05}); },
    busy(){ const t = now(); for (let i=0;i<3;i++){ tone(480, {t:t+i, hold:.45, r:.02, peak:.07}); tone(620, {t:t+i, hold:.45, r:.02, peak:.07}); } },
    horn(){ const t = now(); [0,.5,1.4].forEach((d,i)=>{ const h = i===1 ? .6 : .25; tone(i===2?370:415, {t:t+d, type:'square', a:.02, hold:h, r:.05, peak:.04}); tone(i===2?466:523, {t:t+d, type:'square', a:.02, hold:h, r:.05, peak:.035}); }); },
    rocks(){ const t = now(); for (let i=0;i<9;i++){ const d = t+i*.11+Math.random()*.08; burst({t:d, kind:'brown', f:600, a:.003, r:.14, peak:.55}); burst({t:d, type:'bandpass', f:2200, q:2, a:.002, r:.05, peak:.12}); } },
    glass(){ const t = now(); burst({type:'highpass', f:2500, a:.005, r:.5, peak:.4}); burst({kind:'brown', f:500, a:.005, r:.3, peak:.5});
      for (let i=0;i<10;i++) tone(2500+Math.random()*4000, {t:t+.02+Math.random()*.5, a:.002, r:.25+Math.random()*.3, peak:.04}); },
    thud(){ tone(110, {a:.005, r:.3, peak:.6, fEnd:40}); burst({kind:'brown', f:300, a:.005, r:.2, peak:.5}); },
    slip(){ burst({type:'bandpass', f:1600, fEnd:300, q:1.2, a:.03, hold:.1, r:.35, peak:.35}); },
    steps(){ const t = now(); for (let i=0;i<8;i++) burst({t:t+i*.26, kind:'brown', f:280, a:.005, r:.09, peak:.5}); },
    crack(){ const t = now(); for (let i=0;i<18;i++) burst({t:t+Math.random()*.6, type:'bandpass', f:1200+Math.random()*1500, q:3, a:.002, r:.05, peak:.25});
      burst({t:t+.55, kind:'brown', f:200, a:.01, hold:.3, r:1.2, peak:.8}); },
    recede(){ burst({kind:'brown', f:900, fEnd:180, a:.4, hold:.5, r:3.5, peak:.45}); burst({type:'highpass', f:3000, a:.5, hold:.4, r:3, peak:.06}); },
    heli(){ const h = layer({kind:'brown', f:500, peak:.2, am:11}); setTimeout(()=>h.stop(2), 4500); },
    ding(){ const t = now(); [523.25,659.25,783.99].forEach((f,i)=>{ tone(f, {t:t+i*.42, r:1.1, peak:.18}); tone(f*2, {t:t+i*.42, r:.6, peak:.04}); }); },
    whoosh(){ burst({type:'bandpass', f:400, fEnd:2000, q:1, a:.3, r:.4, peak:.25}); },
    // 게임 안내음
    correct(){ const t = now(); [783.99,987.77,1318.5].forEach((f,i)=>tone(f, {t:t+i*.09, type:'triangle', a:.005, r:.35, peak:.18})); },
    wrong(){ tone(233, {type:'square', a:.01, hold:.12, r:.25, peak:.06, fEnd:150}); },
    heart(){ const t = now(); tone(660, {t, r:.25, peak:.15, fEnd:440}); tone(440, {t:t+.22, r:.5, peak:.15, fEnd:220}); },
    card(){ tone(880, {a:.005, r:.12, peak:.12, fEnd:1320}); tone(1320, {t:now()+.08, a:.005, r:.3, peak:.08}); },
    chapter(){ const t = now(); tone(196, {t, a:.05, hold:.3, r:1.6, peak:.15}); tone(293.66, {t:t+.05, a:.05, hold:.3, r:1.6, peak:.1}); tone(392, {t:t+.1, a:.05, hold:.2, r:1.4, peak:.06}); },
    tick(){ tone(1500, {type:'square', a:.002, r:.04, peak:.04}); },
    tap(){ tone(1000, {a:.002, r:.06, peak:.06, fEnd:700}); },
    over(){ const t = now(); [392,349.23,311.13,261.63].forEach((f,i)=>tone(f, {t:t+i*.28, type:'triangle', r:.5, peak:.14})); },
    fanfare(){ const t = now(); [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f, {t:t+i*.16, type:'triangle', hold:i===3?.4:0, r:.6, peak:.16}));
      [261.63,329.63,392].forEach(f=>tone(f, {t:t+.48, a:.02, hold:.4, r:1.2, peak:.06})); }
  };

  /* 배경 소리 목록 (여러 겹을 합쳐요) */
  const AMBS = {
    none: ()=>[],
    beach: ()=>[layer({kind:'brown', f:700, peak:.35, rate:.13, depth:.2}), layer({type:'highpass', f:3500, peak:.035, rate:.13, depth:.025}), every(6000,11000, FX.gull)],
    lowtide: ()=>[layer({kind:'brown', f:400, peak:.12, rate:.1, depth:.06}), wind(.12)],
    crowd: ()=>[layer({type:'bandpass', f:700, q:.9, peak:.12, rate:3.3, depth:.04}), layer({type:'bandpass', f:1300, q:1.2, peak:.05, rate:4.7, depth:.03}),
                layer({kind:'brown', f:250, peak:.25, rate:.08, depth:.12}), every(8000,14000, FX.siren)],
    roar: ()=>[layer({kind:'brown', f:300, peak:.45, rate:.2, depth:.15}), layer({type:'bandpass', f:900, q:.8, peak:.06, rate:3.5, depth:.03})],
    wind: ()=>[wind(.16), layer({kind:'brown', f:350, peak:.18, rate:.09, depth:.1}), every(10000,18000, FX.siren)],
    heli: ()=>[wind(.1), layer({kind:'brown', f:500, peak:.16, am:11})],
    calm: ()=>[layer({kind:'brown', f:500, peak:.2, rate:.09, depth:.12}), layer({type:'highpass', f:4000, peak:.02, rate:.09, depth:.015}), every(8000,15000, FX.gull)]
  };


  /* ---------- 배경 음악 (코드로 연주해요) ----------
     tension: 위험한 장면 (D단조, 심장 박동 + 낮은 반복음 + 떨리는 현악)
     sad:     재현이가 사라진 장면 (D단조 피아노 엘레지)
     hope:    재회와 엔딩 (F장조 피아노) */
  let musicBus = null, reverb = null, track = null, musicName = 'none', schedId = null;
  const mf = (m)=>440*Math.pow(2,(m-69)/12);
  const NOTE = (s)=>{ const m = s.match(/^([A-G])(#|b)?(\d)$/); const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2]==='#'?1:m[2]==='b'?-1:0); return mf(12*(+m[3]+1)+base); };
  function musicInit(){
    if (musicBus) return;
    musicBus = gain(.55); musicBus.connect(out);
    reverb = ctx.createConvolver(); const len = ctx.sampleRate*2.6, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c=0;c<2;c++){ const d = ir.getChannelData(c); for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 2.6); }
    reverb.buffer = ir; const wet = gain(.32); chain(reverb, wet, musicBus);
  }
  function piano(f, t, vel, dur, dest){   // 피아노 비슷한 소리: 배음을 겹치고 점점 작아지게
    const g = gain(0), lp = filt('lowpass', 2600 + vel*2000); chain(g, lp, dest); lp.connect(reverb);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel*.22, t+.006); g.gain.setTargetAtTime(0, t+.02, dur/3.2);
    [[1,1],[2,.42],[3,.16],[4.02,.07]].forEach(([h,a])=>{ const o = ctx.createOscillator(); o.type = h===1 ? 'triangle' : 'sine'; o.frequency.value = f*h; const og = gain(a); chain(o, og, g); o.start(t); o.stop(t+dur+.2); });
  }
  function pad(fs, t, dur, vol, dest){    // 부드럽게 깔리는 화음
    const g = gain(0), lp = filt('lowpass', 800); chain(g, lp, dest); lp.connect(reverb);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+dur*.35); g.gain.linearRampToValueAtTime(0, t+dur);
    fs.forEach(f=>[-7,7].forEach(cent=>{ const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = cent; const og = gain(.25); chain(o, og, g); o.start(t); o.stop(t+dur+.05); }));
  }
  function pluck(f, t, dur, vol, dest){   // 낮은 반복음
    const o = ctx.createOscillator(), g = gain(0), lp = filt('lowpass', 700, 4);
    o.type = 'sawtooth'; o.frequency.value = f; chain(o, lp, g, dest);
    lp.frequency.setValueAtTime(1400, t); lp.frequency.exponentialRampToValueAtTime(300, t+dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur); o.start(t); o.stop(t+dur+.02);
  }
  function thump(t, vol, dest){ const o = ctx.createOscillator(), g = gain(0); o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(38, t+.25); chain(o, g, dest); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+.35); o.start(t); o.stop(t+.4); }
  function tremolo(fs, t, dur, vol, dest){
    const g = gain(0), am = gain(.5), l = ctx.createOscillator(), lg = gain(.5), bp = filt('bandpass', 900, .7);
    l.frequency.value = 11; chain(l, lg, am.gain); chain(g, am, bp, dest); bp.connect(reverb);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+dur*.7); g.gain.linearRampToValueAtTime(0, t+dur);
    fs.forEach(f=>{ const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; chain(o, g); o.start(t); o.stop(t+dur); });
    l.start(t); l.stop(t+dur);
  }
  // 왼손 펼친화음: 근음-5도-10도-5도를 8분음표로 두 번
  const arp = (root, third, fifth)=>[root, fifth, third+12, fifth, root, fifth, third+12, fifth];
  const SONGS = {
    sad: { beat: 60/60, bars: [
      {lh:arp(50,53,57), ch:[50,57,65], mel:[['A4',2],['F4',1],['E4',1]]},
      {lh:arp(46,50,53), ch:[46,53,62], mel:[['D4',2],['F4',1],['Bb4',1]]},
      {lh:arp(43,46,50), ch:[43,50,58], mel:[['A4',1.5],['G4',.5],['F4',1],['G4',1]]},
      {lh:arp(45,49,52), ch:[45,52,61], mel:[['E4',3],[null,1]]},
      {lh:arp(50,53,57), ch:[50,57,65], mel:[['A4',2],['C5',1],['Bb4',1]]},
      {lh:arp(46,50,53), ch:[46,53,62], mel:[['A4',1],['G4',1],['F4',1],['D4',1]]},
      {lh:arp(43,46,50), ch:[43,50,58], mel:[['G4',1.5],['F4',.5],['E4',1],['D4',1]]},
      {lh:arp(45,49,52), ch:[45,52,61], mel:[['C#4',2],['E4',2]]}
    ]},
    hope: { beat: 60/72, bars: [
      {lh:arp(41,45,48), ch:[53,57,60], mel:[['C5',2],['A4',1],['G4',1]]},
      {lh:arp(40,43,48), ch:[52,55,60], mel:[['G4',2],['E4',1],['F4',1]]},
      {lh:arp(38,41,45), ch:[50,53,57], mel:[['A4',2],['D5',1],['C5',1]]},
      {lh:arp(34,38,41), ch:[46,50,53], mel:[['Bb4',3],['A4',1]]},
      {lh:arp(41,45,48), ch:[53,57,60], mel:[['A4',1],['C5',1],['F5',2]]},
      {lh:arp(36,40,43), ch:[48,52,55], mel:[['E5',2],['D5',1],['C5',1]]},
      {lh:arp(34,38,41), ch:[46,50,53], mel:[['D5',1.5],['C5',.5],['Bb4',1],['A4',1]]},
      {lh:arp(36,40,43), ch:[48,52,55], mel:[['G4',3],[null,1]]}
    ]}
  };
  function scheduleBar(name, n, t, dest){
    if (name === 'tension'){           // 96bpm, 8분음표 = 0.3125초
      const e = 60/96/2, riff = [50,50,53,50,52,50,49,50];
      riff.forEach((m,i)=>pluck(mf(m), t+i*e, e*1.6, .16, dest));
      thump(t, .55, dest); thump(t+e*.9, .35, dest); thump(t+e*4, .55, dest); thump(t+e*4.9, .35, dest);
      if (n % 2 === 0) pad([mf(38), mf(45)], t, e*16, .09, dest);
      if (n % 4 === 2) tremolo([mf(69), mf(70)], t, e*16, .05, dest);
      return e*8;
    }
    const S = SONGS[name], b = S.bars[n % S.bars.length], q = S.beat;
    b.lh.forEach((m,i)=>piano(mf(m), t+i*q/2, .32 - (i%4 ? .08 : 0), q*2.2, dest));
    pad(b.ch.map(mf), t, q*4.2, .035, dest);
    let x = 0; b.mel.forEach(([nm, len])=>{ if (nm) piano(NOTE(nm), t+x*q, .62, q*len*1.6+.6, dest); x += len; });
    return q*4;
  }
  function music(name){
    if (!ctx || name === musicName) return;
    musicInit(); musicName = name;
    if (track){ const old = track; old.g.gain.cancelScheduledValues(now()); old.g.gain.setValueAtTime(old.g.gain.value, now()); old.g.gain.linearRampToValueAtTime(0, now()+1.8); old.alive = false; setTimeout(()=>old.g.disconnect(), 2600); }
    track = null;
    if (name === 'none') return;
    const g = gain(0); g.connect(musicBus); g.gain.linearRampToValueAtTime(1, now()+2);
    const tr = track = {g, name, n:0, next: now()+.15, alive:true};
    if (!schedId) schedId = setInterval(()=>{ const T = track; if (!T || !T.alive) return;
      while (T.next < now()+.6){ const len = scheduleBar(T.name, T.n, T.next, T.g); T.n++; T.next += len; } }, 120);
  }

  return {
    init, music,
    get on(){ return enabled; },
    setOn(v){ enabled = v; if (master) master.gain.setTargetAtTime(v ? 1 : 0, now(), .05); try{ localStorage.setItem('tsunami-sound', v ? '1' : '0'); }catch(e){} },
    play(k){
      if (!ctx || !enabled) return;
      if (SFX_FILES[k]){ try{ new Audio(SFX_FILES[k]).play().catch(()=>{}); }catch(e){} return; }
      if (FX[k]) FX[k]();
    },
    amb(k){ if (!ctx || k === ambKind) return; ambKind = k; ambNow.forEach(x=>x.stop()); ambNow = (AMBS[k] || AMBS.none)(); },
    quake(on){
      if (!ctx) return;
      if (on && !quakeNow){ quakeNow = [layer({kind:'brown', f:110, peak:.9, rate:1.7, depth:.3}), layer({kind:'brown', type:'bandpass', f:600, q:1, peak:.12, rate:5, depth:.08}),
        every(250,700, ()=>burst({type:'bandpass', f:1800+Math.random()*1500, q:4, a:.002, r:.06, peak:.08}))]; FX.rumble(); }
      if (!on && quakeNow){ quakeNow.forEach(x=>x.stop(1.5)); quakeNow = null; }
    },
    muffle(on){ if (ctx) muffleF.frequency.setTargetAtTime(on ? 600 : 18000, now(), .3); }
  };
})();

// 이름 뒤 받침이 있는지 확인 (하늘 → 받침 있음, 지우 → 없음)
function hasBatchim(word){
  const c = word.charCodeAt(word.length-1) - 0xAC00;
  return c >= 0 && c <= 11171 && c % 28 !== 0;
}
// {이름}, {학년}, {반}을 실제 값으로 바꾸고 조사를 맞춰요
function fill(t){
  if (typeof t === 'function') t = t(state);
  const n = state.call, b = hasBatchim(n);
  return t.replace(/\{이름\}(아|을|은|의|이)?/g, (m, j) => {
    if (j === '아') return n + (b ? '아' : '야');
    if (j === '을') return n + (b ? '이를' : '를');
    if (j === '은') return n + (b ? '이는' : '는');
    if (j === '의') return n + (b ? '이의' : '의');
    if (j === '이') return n + (b ? '이가' : '가');
    return n + (b ? '이' : '');
  }).replace(/\{학년\}/g, state.grade).replace(/\{반\}/g, state.cls);
}

const IMG_RATIO = 1264/848;

function fitPic(layer){   // 그림이 화면을 꽉 채우도록 크기 맞추기
  const pic = layer.querySelector('.pic'); if (!pic) return;
  const W = layer.clientWidth, H = layer.clientHeight;
  const img = pic.querySelector('img'), ratio = img && img.naturalWidth ? img.naturalWidth/img.naturalHeight : IMG_RATIO;
  let w = W, h = W/ratio; if (h < H){ h = H; w = H*ratio; }
  pic.style.width = w+'px'; pic.style.height = h+'px';
  const fx = +(layer.dataset.fx || .5);   // 화면이 좁을 때 그림의 어느 쪽을 보여줄지 (0 왼쪽 ~ 1 오른쪽)
  pic.style.left = Math.min(0, Math.max(W - w, W/2 - fx*w)) + 'px';
  const c = pic.querySelector('canvas'), dpr = Math.min(1.5, window.devicePixelRatio||1);
  c.width = Math.round(w*dpr); c.height = Math.round(h*dpr);
}
addEventListener('resize', ()=>document.querySelectorAll('.bg').forEach(fitPic));

function startAnim(layer, cfg){
  const canvas = layer.querySelector('canvas');
  const parts = {};
  const box = (r)=>({x0:r[0], y0:r[1], x1:r[2], y1:r[3]});
  if (cfg.sparkle) parts.sparkle = Array.from({length:cfg.sparkle[4]}, ()=>({...pt(box(cfg.sparkle)), ph:rr(0,6.3), sp:rr(.8,2.2)}));
  if (cfg.foam)    parts.foam    = Array.from({length:cfg.foam[4]}, ()=>({...pt(box(cfg.foam)), ph:rr(0,6.3), sp:rr(1.5,3)}));
  if (cfg.rain)    parts.rain    = Array.from({length:cfg.rain}, ()=>({x:rr(0,1), y:rr(0,1), l:rr(.02,.045), v:rr(.9,1.4)}));
  if (cfg.wind)    parts.wind    = Array.from({length:cfg.wind}, ()=>({x:rr(-.5,1), y:rr(.05,.6), l:rr(.12,.25), v:rr(.35,.6), c:rr(-.03,.03)}));
  if (cfg.mist)    parts.mist    = Array.from({length:cfg.mist[4]}, ()=>({...pt(box(cfg.mist)), r:rr(.02,.05), v:rr(.01,.03), a:rr(.15,.35)}));
  parts.sparks = []; parts.nextSpark = 0; parts.gulls = []; parts.nextGull = rr(1,4);
  animNow = {canvas, cfg, parts, t:0, last:performance.now()};
  function pt(b){ return {x:rr(b.x0,b.x1), y:rr(b.y0,b.y1), b}; }
}
function stopAnim(){ animNow = null; }

function animLoop(now){
  requestAnimationFrame(animLoop);
  const A = animNow; if (!A || reduceMotion) return;
  const dt = Math.min(.05, (now - A.last)/1000); A.last = now; A.t += dt;
  const c = A.canvas, ctx = c.getContext('2d'), W = c.width, H = c.height, t = A.t, P = A.parts, cfg = A.cfg;
  ctx.clearRect(0,0,W,H);
  // 물 위 반짝임 (별 모양)
  for (const [list, size] of [[P.sparkle, 1], [P.foam, 1.6]]){
    if (!list) continue;
    const col = list === P.sparkle ? cfg.sparkle[5] : '#ffffff';
    for (const s of list){
      const a = Math.pow(Math.max(0, Math.sin(t*s.sp + s.ph)), 6);
      if (a < .005 && Math.random() < .03){ s.x = rr(s.b.x0,s.b.x1); s.y = rr(s.b.y0,s.b.y1); }
      if (a < .02) continue;
      const x = s.x*W, y = s.y*H, r = (2 + 5*a) * size * W/1400;
      ctx.globalAlpha = a; ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = Math.max(1, r*.35);
      ctx.beginPath(); ctx.arc(x, y, r*.45, 0, 7); ctx.fill();
      if (list === P.sparkle){ ctx.beginPath(); ctx.moveTo(x-r*1.8, y); ctx.lineTo(x+r*1.8, y); ctx.moveTo(x, y-r*1.8); ctx.lineTo(x, y+r*1.8); ctx.stroke(); }
      else { ctx.beginPath(); ctx.ellipse(x, y, r*1.6, r*.5, 0, 0, 7); ctx.fill(); }
    }
  }
  // 비
  if (P.rain){
    ctx.globalAlpha = .45; ctx.strokeStyle = '#dce9f2'; ctx.lineWidth = Math.max(1, W/900);
    ctx.beginPath();
    for (const d of P.rain){
      d.y += d.v*dt; d.x += d.v*dt*.28; if (d.y > 1){ d.y = -d.l; d.x = rr(-.2,1); }
      ctx.moveTo(d.x*W, d.y*H); ctx.lineTo((d.x + d.l*.28)*W, (d.y + d.l)*H);
    }
    ctx.stroke();
  }
  // 바람 줄기
  if (P.wind){
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1, W/1100);
    for (const w of P.wind){
      w.x += w.v*dt; if (w.x > 1.2){ w.x = rr(-.6,-.2); w.y = rr(.05,.6); }
      ctx.globalAlpha = .28;
      ctx.beginPath(); ctx.moveTo(w.x*W, w.y*H); ctx.quadraticCurveTo((w.x + w.l/2)*W, (w.y + w.c)*H, (w.x + w.l)*W, (w.y + w.c*.3)*H); ctx.stroke();
    }
  }
  // 물보라 (위로 피어오르는 하얀 안개)
  if (P.mist){
    for (const m of P.mist){
      m.y -= m.v*dt; const life = (m.b.y1 - m.y)/(m.b.y1 - m.b.y0);
      if (m.y < m.b.y0 - .08){ m.y = m.b.y1; m.x = rr(m.b.x0,m.b.x1); }
      const g = ctx.createRadialGradient(m.x*W, m.y*H, 0, m.x*W, m.y*H, m.r*W*(1+life));
      g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = m.a * (1 - Math.min(1, Math.max(0, life-.3))); ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(m.x*W, m.y*H, m.r*W*(1+life), 0, 7); ctx.fill();
    }
  }
  // 전깃줄 불꽃
  if (cfg.sparks){
    const [sx, sy] = cfg.sparks;
    if (t > P.nextSpark){ P.nextSpark = t + rr(.6,1.6); for (let i=0;i<14;i++) P.sparks.push({x:sx, y:sy, vx:rr(-.12,.12), vy:rr(-.22,-.04), life:rr(.3,.6), age:0}); P.flash = .25; }
    P.flash = Math.max(0, (P.flash||0) - dt);
    if (P.flash > 0){ const g = ctx.createRadialGradient(sx*W, sy*H, 0, sx*W, sy*H, W*.05); g.addColorStop(0,'rgba(255,240,150,.9)'); g.addColorStop(1,'rgba(255,240,150,0)'); ctx.globalAlpha = P.flash*4 > 1 ? 1 : P.flash*4; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx*W, sy*H, W*.05, 0, 7); ctx.fill(); }
    ctx.lineWidth = Math.max(1.5, W/800); ctx.strokeStyle = '#ffe066';
    P.sparks = P.sparks.filter(p=>{ p.age += dt; p.vy += .5*dt; const ox = p.x, oy = p.y; p.x += p.vx*dt; p.y += p.vy*dt;
      ctx.globalAlpha = 1 - p.age/p.life; ctx.beginPath(); ctx.moveTo(ox*W, oy*H); ctx.lineTo(p.x*W + (p.x-ox)*W*2, p.y*H + (p.y-oy)*H*2); ctx.stroke(); return p.age < p.life; });
  }
  // 구급차 경광등
  if (cfg.siren){
    cfg.siren.forEach(([x,y,col], i)=>{
      const on = Math.sin(t*9 + i*Math.PI) > 0;
      const g = ctx.createRadialGradient(x*W, y*H, 0, x*W, y*H, W*.045);
      g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = on ? .85 : .12; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x*W, y*H, W*.045, 0, 7); ctx.fill();
    });
  }
  // 갈매기 (가끔 날아가요)
  if (cfg.gull){
    if (t > P.nextGull){ P.nextGull = t + rr(7,14); P.gulls.push({x:-.05, y:rr(.08,.3), v:rr(.05,.09), s:rr(.012,.022), ph:rr(0,6)}); }
    ctx.strokeStyle = '#3a4250'; ctx.lineCap = 'round';
    P.gulls = P.gulls.filter(g=>{ g.x += g.v*dt; g.y += Math.sin(t*1.3+g.ph)*.004*dt; const f = Math.sin(t*7+g.ph)*.6;
      const x = g.x*W, y = g.y*H, s = g.s*W; ctx.globalAlpha = .9; ctx.lineWidth = Math.max(1.5, s*.18);
      ctx.beginPath(); ctx.moveTo(x - s, y - s*f*.6); ctx.quadraticCurveTo(x - s*.4, y - s*.5, x, y); ctx.quadraticCurveTo(x + s*.4, y - s*.5, x + s, y - s*f*.6); ctx.stroke();
      return g.x < 1.08; });
  }
  ctx.globalAlpha = 1;
}
requestAnimationFrame(animLoop);

/* 화면 효과 */
function fx(k){
  const st = $('stage');
  if (k === 'shake'){ st.classList.add('shake'); Sound.quake(true); }
  if (k === 'tremble'){ st.classList.remove('tremble'); void st.offsetWidth; st.classList.add('tremble'); setTimeout(()=>st.classList.remove('tremble'),1000); Sound.play('rumble'); }
  if (k === 'slow'){ st.classList.add('slow'); Sound.muffle(true); Sound.play('whoosh'); }
  if (k === 'stop'){ st.classList.remove('shake','slow'); Sound.quake(false); Sound.muffle(false); }
  if (k === 'wave'){ const w=$('wave'); w.classList.remove('go'); void w.offsetWidth; w.classList.add('go'); Sound.play('crash'); }
  if (k === 'white'){ const f=$('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); Sound.amb('none'); }
}

/* =================================================================
   흐름 제어: 뒤로가기 · 건너뛰기 · 재시작
   - 장이 시작될 때 상태를 저장(saveSnap)하고, 그 장에서 고른 선택(decisions)과
     지나간 대사 번호(line)를 기록해요.
   - 뒤로가기 = 장 처음부터 같은 선택으로 '빨리 감기'해서 바로 앞 대사에서 멈추기
   - 이미 고른 선택보다 앞으로는 돌아갈 수 없어요 (틀린 답을 지워서 하트를 되살리지 못하게)
   ================================================================= */
const ABORT = { abort: true };
let runId = 0;            // 지금 돌아가는 흐름 번호. 바뀌면 예전 흐름은 멈춰요
let pendings = [];        // 기다리는 중인 것들 (멈출 때 한꺼번에 풀어요)
let ff = null;            // 빨리 감기 중: {decisions, di, stopLine, hint}
let skipping = false;     // 건너뛰기 중 (다음 선택지까지)
let chap = newChap();     // 이번 장의 기록
function newChap(){ return { line: 0, pos: 0, decisions: [], decLine: 0, hint: false }; }
const fast = ()=> !!ff || skipping;
const sfx = (k)=>{ if (!ff) Sound.play(k); };

// 취소할 수 있는 기다림: 다른 흐름으로 바뀌면 ABORT로 멈춰요
function waitFor(setup){
  const id = runId;
  return new Promise((resolve, reject)=>{
    const p = { cancel: ()=>reject(ABORT) };
    pendings.push(p);
    setup(v=>{ pendings = pendings.filter(x=>x !== p); if (id !== runId) reject(ABORT); else resolve(v); });
  });
}
function check(id){ if (id !== runId) throw ABORT; }
function abortRun(){
  runId++; const ps = pendings; pendings = []; ps.forEach(p=>p.cancel());
  advance = null; skipping = false;
  ['choices','feedback','over','cardBox','chapter','menu'].forEach(id=>{ const el = $(id); if (el) el.hidden = true; });
  $('choices').innerHTML = '';
}

/* 말풍선: 글자가 한 글자씩 나오고, 누르면 다음으로 넘어가요 */
let advance = null;   // 지금 '누르면 실행할 일'
function showLine(who, text, dir){
  const [id, mood] = (who || '').split(':');
  const p = id ? PEOPLE[id] : null;
  const name = p ? (typeof p.name === 'function' ? p.name() : p.name) : '';
  $('dialog').hidden = false;
  $('dialog').classList.toggle('narr', !p);
  const ava = $('ava');
  ava.className = 'ava' + (p ? '' : ' none');
  if (p){
    ava.style.background = p.color; ava.style.borderColor = lighten(p.color);
    const src = faceSrc(id, mood);
    const key = id + ':' + (mood||'');
    if (ava.dataset.key !== key){ ava.classList.remove('pop'); void ava.offsetWidth; ava.classList.add('pop'); ava.dataset.key = key; }
    if (src) ava.innerHTML = `<img src="${src}" alt="${name}">`; else ava.textContent = p.mark || name.charAt(0);
  } else ava.dataset.key = '';
  $('who').textContent = name; $('who').style.color = p ? lighten(p.color) : '';
  $('who').hidden = !p;
  $('dir').textContent = dir ? `(${dir})` : ''; $('dir').hidden = !dir;
}
function lighten(hex){ // 이름 글자를 프로필 색보다 밝게
  const n = parseInt(hex.slice(1),16); const f = v=>Math.min(255, Math.round(v + (255-v)*.45));
  return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;
}
function say(who, rawText, dir){
  const lineNo = chap.line++;
  if (ff){ if (lineNo < ff.stopLine) return; endFF(); }
  const text = fill(rawText);
  showLine(who, text, dir);
  const txt = $('txt'), next = $('next');
  if (skipping){ txt.textContent = text; return; }
  chap.pos = lineNo; updateNav();
  speak(text);
  next.classList.remove('on');
  const id = runId;      // 뒤로가기 등으로 흐름이 바뀌면 이 대사의 타자 효과도 멈춰요
  return waitFor(done=>{
    let i = 0, finished = false;
    const finish = ()=>{ if (id !== runId) return; finished = true; txt.textContent = text; next.classList.add('on'); advance = ()=>{ advance = null; done(); }; };
    if (reduceMotion){ finish(); return; }
    txt.textContent = '';
    advance = finish;     // 글자가 나오는 중에 누르면 한 번에 다 보여줘요
    (function type(){ if (finished || id !== runId) return; i += 1; txt.textContent = text.slice(0,i); if (i >= text.length) finish(); else setTimeout(type, 28); })();
  });
}
function endFF(){ ff = null; updateNav(); }
function stopSkip(){ if (skipping){ skipping = false; updateNav(); } }
// 화면을 누르거나 스페이스/엔터를 누르면 다음으로
$('dialog').addEventListener('click', ()=>{ if (advance && $('choices').hidden) advance(); });
$('stage').addEventListener('click', ()=>{ if (advance && $('choices').hidden && !$('dialog').hidden) advance(); });
addEventListener('keydown', e=>{ if ((e.key===' '||e.key==='Enter') && advance && $('choices').hidden && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); advance(); } });

/* 덮개 화면 보여주고 버튼 누를 때까지 기다리기 */
function waitButton(coverId, btnId){
  $(coverId).hidden = false;
  return waitFor(done=>{ $(btnId).onclick = ()=>{ $(coverId).hidden = true; done(); }; });
}

/* 장 제목 */
async function showChapter(n, title){
  $('chN').textContent = n + '장'; $('chT').textContent = title;
  $('chNum').textContent = `${n}장`; $('chName').textContent = title;
  if (ff) return;
  stopSkip();
  $('chapter').hidden = false; sfx('chapter'); speak(`${n}장. ${title}`);
  await waitFor(done=>{ const t = setTimeout(done, 2200); $('chapter').onclick = ()=>{ clearTimeout(t); done(); }; });
  $('chapter').hidden = true;
}

/* 카드뉴스 팝업 */
function showCard(k){
  if (ff) return;
  stopSkip();
  const c = CARDS[k];
  const box = $('cardBox');
  box.innerHTML = `<div class="card" role="dialog" aria-label="${c.title}">
    <div class="card-top"><span class="kind">${c.kind}</span><span class="chip">${c.no}</span></div>
    <div class="card-body">${c.img ? `<img src="${c.img}" alt="${c.title}">` : ''}<h3>${c.title}</h3>
      <ul>${c.lines.map((l,i)=>`<li class="${c.emph===i?'emph':''}">${l}</li>`).join('')}</ul></div>
    <div class="card-foot"><small>출처: 행정안전부</small><button class="big-btn" id="cardOk">알겠어요!</button></div></div>`;
  sfx('card'); speak(c.title + '. ' + c.lines.join(' '));
  return waitButton('cardBox','cardOk');
}

/* 틀렸을 때: 왜 위험한지 알려줘요 */
function showFeedback(text){
  if (ff) return;
  stopSkip();
  $('fbHeart').innerHTML = HEART.replace('<svg','<svg style="filter:grayscale(1)"');
  $('fbText').textContent = text;
  speak('앗, 위험했어요! ' + text);
  return waitButton('feedback','fbBtn');
}

/* 순서를 섞어요 (정답이 늘 같은 자리에 있으면 외워 버리니까요) */
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* 선택지 보여주고, 고른 것을 돌려줘요 */
function askChoice(c, opts){
  const byK = (k)=> k === -1 ? {timeout:true, k:-1, ...c.timeout} : opts.find(o=>o.k === k);
  // 빨리 감기 중이면 예전에 골랐던 것을 그대로 골라요
  if (ff){
    if (ff.di < ff.decisions.length){ const k = ff.decisions[ff.di++]; chap.decisions.push(k); chap.decLine = chap.line; return Promise.resolve(byK(k)); }
    endFF();
  }
  stopSkip();
  chap.pos = chap.line; updateNav();
  const box = $('choices');
  box.innerHTML = '';
  const q = document.createElement('div'); q.className = 'q'; q.textContent = fill(c.q); box.appendChild(q);
  let timerId = null, tickId = null;
  return waitFor(done=>{
    const pick = (o)=>{ clearTimeout(timerId); clearInterval(tickId); sfx('tap'); box.hidden = true; box.innerHTML = '';
      chap.decisions.push(o.k); chap.decLine = chap.line; updateNav(); done(o); };
    if (c.timer){
      const bar = document.createElement('div'); bar.className = 'timer'; bar.innerHTML = '<i></i>'; box.appendChild(bar);
      bar.firstChild.animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}], {duration:c.timer*1000, fill:'forwards'});
      timerId = setTimeout(()=>pick(byK(-1)), c.timer*1000);
      sfx('tick'); tickId = setInterval(()=>sfx('tick'), 1000);
      pendings.push({cancel:()=>{ clearTimeout(timerId); clearInterval(tickId); }});
    }
    opts.forEach((o, n)=>{
      const b = document.createElement('button');
      b.className = 'opt'; b.dataset.k = o.k;
      b.innerHTML = `<span class="num">${n+1}</span><span></span>`;
      b.lastChild.textContent = fill(o.text);
      b.onclick = ()=>pick(o);
      box.appendChild(b);
    });
    if (c.hint && !c.noHint && !state.hintUsed && state.ch >= 2){
      const h = document.createElement('button');
      h.className = 'hint'; h.textContent = '송화에게 물어보기 (이 장에서 한 번)';
      h.onclick = ()=>{ state.hintUsed = true; chap.hint = true; h.remove(); showLine('sw'); const t = fill(c.hint); $('txt').textContent = t; $('next').classList.remove('on'); speak(t); };
      box.appendChild(h);
    }
    box.hidden = false;
    speak(fill(c.q) + ' ' + opts.map((o,n)=>`${n+1}번, ${fill(o.text)}`).join('. '));
  });
}

/* 선택 한 개 처리: 연습 / 하트 없는 선택 / 보통 선택
   정답: res(결과 + 칭찬 대사) → 카드뉴스
   오답: res(결과 장면) → 하트 -1 → 왜 위험한지(fb) → after(인물들의 대화: 남 탓, 앞으로는 이렇게 하자) */
async function doChoice(c){
  const id = runId;
  let opts = c.opts.map((o,k)=>({...o, k}));
  if (!c.unscored) opts = shuffle(opts);
  while (true){
    const o = await askChoice(c, opts); check(id);
    if (c.practice){ Object.assign(state, o.set || {}); return runSteps(o.res || []); }
    if (c.unscored){
      await runSteps(o.res || []); check(id);
      if (o.ok) return;
      opts = opts.filter(x=>x.ok);        // 선생님이 다시 묻고, 첫 번째 선택지만 남아요
      continue;
    }
    const r = await runSteps(o.res || []); check(id);
    if (r === 'over') return r;
    state.lastOk = !!o.ok;
    if (o.ok){
      sfx('correct'); if (!fast()) await wait(450); check(id);
      if (c.card) await showCard(c.card);
      return;
    }
    state.hearts -= 1; drawHearts(state.hearts); sfx('wrong'); if (!ff) setTimeout(()=>Sound.play('heart'), 300);
    if (state.hearts <= 0){ lastLesson = o.fb; return 'over'; }
    await showFeedback(o.fb); check(id);
    return runSteps(o.after || []);
  }
}

/* 대본 한 줄 실행 */
let lastLesson = '';
async function runStep(s){
  switch (s.t){
    case 'say': if (!fast()) playVoice(s.voice); return say(s.who, s.text, s.dir);
    case 'bg': setBg(typeof s.k === 'function' ? s.k(state) : s.k); return;
    case 'fx':
      if (fast() && ['wave','white','tremble'].includes(s.k)){ if (s.k === 'white') Sound.amb('none'); return; }
      fx(s.k); if (s.k==='wave'||s.k==='white') await wait(700); return;
    case 'card': return showCard(s.k);
    case 'sfx': if (!fast()) Sound.play(typeof s.k === 'function' ? s.k(state) : s.k); return;
    case 'amb': Sound.amb(s.k); return;
    case 'mus': Sound.music(s.k); return;
    case 'choice': return doChoice(s);
    case 'if': if (s.cond(state)) return runSteps(s.steps); return;
    case 'save':
      state.ch = s.ch; state.chTitle = s.title; state.hintUsed = ff ? ff.hint : false;
      saveSnap = JSON.parse(JSON.stringify(state));   // 지금 상태를 저장(세이브)
      chap = newChap(); chap.hint = state.hintUsed;
      if (!ff) $('dialog').hidden = true;
      return showChapter(s.ch, s.title);
    case 'end': stopSkip(); return showEnding();
  }
}
async function runSteps(list){
  const id = runId;
  for (const s of list){ const r = await runStep(s); check(id); if (r === 'over') return 'over'; }
}

/* 게임 전체 흐름: 하트가 0이 되면 이번 장 처음으로 돌아가요 */
let saveSnap = null, saveIdx = 0, topIdx = 0;
const SAVE_AT = SCRIPT.map((s,i)=>s.t === 'save' ? i : -1).filter(i=>i >= 0);
async function play(start = 0){
  const id = runId;
  let i = start;
  try {
    while (i < SCRIPT.length){
      if (SCRIPT[i].t === 'save') saveIdx = i;
      topIdx = i; updateProgress();
      const r = await runStep(SCRIPT[i]); check(id);
      if (r === 'over'){
        fx('stop'); $('dialog').hidden = true; Sound.amb('none'); Sound.music('none'); Sound.play('over');
        $('overText').textContent = lastLesson;
        $('overBtn').textContent = `${state.ch}장 처음부터 다시 하기`;
        speak('앗, 위험했어요! 다시 해볼까요? ' + lastLesson);
        await waitButton('over','overBtn'); check(id);
        Object.assign(state, saveSnap, {hearts:3});   // 저장한 곳으로 돌아가고 하트 3개
        drawHearts(); currentBg = '';
        i = saveIdx; continue;
      }
      i++;
    }
  } catch (e){ if (e !== ABORT) throw e; }
}

/* 진행 막대: 8개 장 + 장 안에서 얼마나 왔는지 */
function updateProgress(){
  const k = SAVE_AT.indexOf(saveIdx);
  const end = SAVE_AT[k+1] ?? SCRIPT.length;
  const inCh = Math.max(0, Math.min(1, (topIdx - saveIdx) / Math.max(1, end - saveIdx)));
  const total = SAVE_AT.length;
  $('pfill').style.width = (((k < 0 ? 0 : k) + inCh) / total * 100).toFixed(1) + '%';
}

/* 아래 버튼들: 뒤로 / 건너뛰기 / 다시 */
function updateNav(){
  const target = chap.pos - 1;
  $('backBtn').disabled = !!ff || target < 0 || target < chap.decLine;
  $('skipBtn').disabled = !!ff || !$('choices').hidden;
  $('skipBtn').classList.toggle('on', skipping);
}
function rewindTo(stopLine, decisions, hint){
  abortRun();
  Object.assign(state, JSON.parse(JSON.stringify(saveSnap)));
  drawHearts(); fx('stop'); currentBg = '';
  ff = stopLine == null ? null : { decisions, di: 0, stopLine, hint };
  updateNav();
  play(saveIdx);
}
function goBack(){
  if ($('backBtn').disabled) return;
  rewindTo(chap.pos - 1, chap.decisions.slice(), chap.hint);
}
function goSkip(){
  if ($('skipBtn').disabled) return;
  skipping = true; updateNav();
  if (advance){ advance(); if (advance) advance(); }   // 지금 대사도 바로 넘겨요
}
function restartChapter(){ $('menu').hidden = true; rewindTo(null); }
function restartGame(){
  $('menu').hidden = true; abortRun(); ff = null;
  Object.assign(state, { hearts: 3, loc: 'sand', lastOk: true, hintUsed: false });
  drawHearts(); fx('stop'); currentBg = ''; Sound.music('none');
  play(0);
}

/* 엔딩: 남은 하트로 칭호, 안전수칙 카드 넘겨보기 */
function showEnding(){
  fx('stop'); $('dialog').hidden = true; Sound.amb('calm'); Sound.music('hope'); Sound.play('fanfare');
  const titles = {3:'재난 안전 대장', 2:'용감한 생존자', 1:'끝까지 포기하지 않은 친구'};
  $('badge').textContent = titles[state.hearts] || titles[1];
  $('whoLine').textContent = `와석초등학교 ${state.grade}학년 ${state.cls}반 ${state.name}`;
  const pages = [...RULES.map((r,i)=>({no:`안전수칙 ${i+1} / ${RULES.length}`, text:r})),
                 {no:'더 알아보기', text:CARDS.t6.lines[0], small:'출처: 행정안전부'}];
  let at = 0;
  const draw = ()=>{
    const p = pages[at];
    $('rule').innerHTML = `<div class="no">${p.no}</div><p></p>${p.small?`<small>${p.small}</small>`:''}`;
    $('rule').querySelector('p').textContent = p.text;
    $('dots').innerHTML = pages.map((_,i)=>`<i class="${i===at?'on':''}"></i>`).join('');
    $('prevR').disabled = at === 0; $('nextR').disabled = at === pages.length-1;
    speak(p.text);
  };
  $('prevR').onclick = ()=>{ if (at>0){ at--; draw(); } };
  $('nextR').onclick = ()=>{ if (at<pages.length-1){ at++; draw(); } };
  $('ending').hidden = false;
  draw();
  speak(`${$('badge').textContent}! 오늘 배운 안전수칙을 넘겨 봐요.`);
  return new Promise(r=>{ $('againBtn').onclick = ()=>{ $('ending').hidden = true; r(); location.reload(); }; });
}

/* ⑥ 시작 화면 */
(function init(){
  for (let g=1; g<=6; g++) $('gr').add(new Option(g+'학년', g, g===2, g===2));
  for (let c=1; c<=10; c++) $('cl').add(new Option(c+'반', c, c===6, c===6));
  setBg('beach');
  const sndUi = ()=>{ $('sndBtn').setAttribute('aria-pressed', Sound.on); $('sndLbl').textContent = Sound.on ? '소리 켬' : '소리 끔'; };
  sndUi();
  $('sndBtn').onclick = (e)=>{ e.stopPropagation(); Sound.init(); Sound.setOn(!Sound.on); sndUi(); };
  // 뒤로 / 건너뛰기 / 다시 버튼
  $('backBtn').onclick = (e)=>{ e.stopPropagation(); goBack(); };
  $('skipBtn').onclick = (e)=>{ e.stopPropagation(); goSkip(); };
  $('restartBtn').onclick = (e)=>{ e.stopPropagation(); $('rsChapter').textContent = `${state.ch}장 처음부터`; $('menu').hidden = false; };
  $('rsChapter').onclick = restartChapter;
  $('rsGame').onclick = restartGame;
  $('rsCancel').onclick = ()=>{ $('menu').hidden = true; };
  $('startForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = $('nm').value.replace(/\s/g,'');
    if (!name){ $('err').textContent = '이름을 먼저 써 주세요!'; $('nm').focus(); return; }
    state.name = name;
    // 세 글자 한글 이름이면 성을 빼고 불러요 (김하늘 → 하늘)
    state.call = /^[가-힣]{3}$/.test(name) ? name.slice(1) : name;
    state.grade = +$('gr').value; state.cls = +$('cl').value;
    Sound.init();   // 효과음은 버튼을 누른 뒤에만 켤 수 있어요
    $('start').hidden = true; $('hud').hidden = false; drawHearts();
    await showCard('t1');
    play(0);
  });
})();
</script>
